# Traffic Shaping cNF configuration

interface: veth-ts

# process traffic only after it exceeds the P4 profile limit
activation_mode: on_exceed_only

# default shaping profile 
default_rate_Bps: 1250000
default_burst_bytes: 50000
default_queue_limit_bytes: 1048576

# egress queue discipline - hierarchal token bucket
qdisc: htb

# per-slice shaping profiles
# packets above profile limit are enqueued and released when tokens become available
profiles:
  - slice_id: 1
    name: bronze
    src_ip: "10.0.1.1"
    rate_Bps: 125000      # 1 Mbps (Fila lenta)
    burst_bytes: 50000
    queue_limit_bytes: 1048576

  - slice_id: 2
    name: silver
    src_ip: "10.0.1.2"
    rate_Bps: 187500  # 1.5 Mbps (Fila lenta)
    burst_bytes: 50000
    queue_limit_bytes: 1048576

  - slice_id: 3
    name: gold
    src_ip: "10.0.1.3"
    rate_Bps: 250000      # 2 Mbps (Fila lenta)
    burst_bytes: 50000
    queue_limit_bytes: 1048576

# behavior when traffic exceeds profile limit
on_exceed:
  action: enqueue
  release_policy: token_bucket
  overflow_action: drop
  remark_dscp: null
