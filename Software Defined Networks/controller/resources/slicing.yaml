device: d2
grpc_addr: "127.0.0.1:50052"
device_id: 2
p4info: d2_slicing.p4info.txt
json: d2_slicing.json

# ------------------------------------------------------------------------------
# 1. REGRAS DE SLICING (Mapeamento de IP de origem para ID do Slice)
# ------------------------------------------------------------------------------
slices:
  - id: 1
    name: bronze
    src_ip: "10.0.1.1"
    rate: 1250000     # 10 Mbps (em Bytes/s)
    burst: 50000      # Tolerância de pico em Bytes

  - id: 2
    name: silver
    src_ip: "10.0.1.2"
    rate: 1875000     # 15 Mbps (em Bytes/s)
    burst: 50000

  - id: 3
    name: gold
    src_ip: "10.0.1.3"
    rate: 3125000     # 25 Mbps (em Bytes/s)
    burst: 50000

# ------------------------------------------------------------------------------
# 2. REGRAS DE ENCAMINHAMENTO L3, MAC, ARP e DHCP
# ------------------------------------------------------------------------------
table_entries:
  # --- Encaminhamento para a LAN 1 (h1, h2, h3) ---
  - table: MyIngress.ipv4Lpm
    match:
      hdr.ipv4.dstAddr: ["10.0.1.1", 32]
    action: MyIngress.forward
    params:
      egressPort: 1
      nextHopMac: "aa:00:00:00:01:01"

  - table: MyIngress.ipv4Lpm
    match:
      hdr.ipv4.dstAddr: ["10.0.1.2", 32]
    action: MyIngress.forward
    params:
      egressPort: 1
      nextHopMac: "aa:00:00:00:01:02"

  - table: MyIngress.ipv4Lpm
    match:
      hdr.ipv4.dstAddr: ["10.0.1.3", 32]
    action: MyIngress.forward
    params:
      egressPort: 1
      nextHopMac: "aa:00:00:00:01:03"

  # --- Encaminhamento para a LAN 2 (h4, h5, h6) ---
  - table: MyIngress.ipv4Lpm
    match:
      hdr.ipv4.dstAddr: ["10.0.2.4", 32]
    action: MyIngress.forward
    params:
      egressPort: 2
      nextHopMac: "aa:00:00:00:02:04"

  - table: MyIngress.ipv4Lpm
    match:
      hdr.ipv4.dstAddr: ["10.0.2.5", 32]
    action: MyIngress.forward
    params:
      egressPort: 2
      nextHopMac: "aa:00:00:00:02:05"

  - table: MyIngress.ipv4Lpm
    match:
      hdr.ipv4.dstAddr: ["10.0.2.6", 32]
    action: MyIngress.forward
    params:
      egressPort: 2
      nextHopMac: "aa:00:00:00:02:06"

  # --- Reescrever MAC Address de Origem do Router ---
  - table: MyIngress.internalMacLookup
    match:
      std_meta.egress_spec: 1
    action: MyIngress.rewriteMacs
    params:
      srcMac: "cc:00:00:00:02:01"

  - table: MyIngress.internalMacLookup
    match:
      std_meta.egress_spec: 2
    action: MyIngress.rewriteMacs
    params:
      srcMac: "cc:00:00:00:02:02"

  # --- Rotas do ARP Proxy ---
  - table: MyIngress.arpRoute
    match:
      hdr.arp.tpa: ["10.0.1.0", 24]
    action: MyIngress.forward_to_port
    params:
      port: 1

  - table: MyIngress.arpRoute
    match:
      hdr.arp.tpa: ["10.0.2.0", 24]
    action: MyIngress.forward_to_port
    params:
      port: 2

  # --- Rotas do DHCP Server ---
  - table: MyIngress.dhcpRoute
    match:
      hdr.ipv4.dstAddr: ["255.255.255.255", 32]
    action: MyIngress.forward_to_port
    params:
      port: 2

  - table: MyIngress.dhcpRoute
    match:
      hdr.ipv4.dstAddr: ["10.0.2.0", 24]
    action: MyIngress.forward_to_port
    params:
      port: 2